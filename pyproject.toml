[project]
name = "rbench"
version = "0.1.0"
description = "The R benchmark suite and the harness to run them"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["rbench.py", "rbench_perf.py"]
