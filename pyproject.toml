[project]
name = "rbench"
version = "0.1.0"
description = "The R benchmark suite and the harness to run them"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["bench"]

[tool.uv.sources]
bench = { git = "https://github.com/PRL-PRG/bench.git", rev = "085fac1713663b93b0f5c8778f335122068f297f" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"rbench.py" = "rbench/__init__.py"
"rbench_perf.py" = "rbench/perf.py"
"benchmarks" = "rbench/benchmarks"
"perf" = "rbench/perf"

[tool.pyright]
venvPath= "."
venv= ".venv"
pythonVersion = "3.12"
